name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons:
    name: Validar lecciones y currículo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar currículo y lecciones
        run: python tools/lessons.py validate

      - name: Verificar que el índice esté actualizado
        run: python tools/lessons.py index --check

      - name: Pruebas
        run: python -m unittest discover -s tests -v

  markdown:
    name: Estilo Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
